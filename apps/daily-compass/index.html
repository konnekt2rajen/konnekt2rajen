<title>Daily Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EDF4; --ink:#131A2A; --muted:#5A6478; --faint:#8A93A6; --line:#DCE2EC;
  --accent:#3563E9; --on-accent:#FFFFFF;
  --good:#1E8A57; --warn:#B26B00; --bad:#C2352F;
  --good-bg:#E4F4EC; --warn-bg:#FBF0DC; --bad-bg:#FBE7E6;
  --sans:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --pad:16px; --gap:14px; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1119; --surface:#161C28; --surface-2:#202838; --ink:#E8ECF4; --muted:#A0A9BB; --faint:#768096; --line:#2A3345;
    --good:#5CCB8F; --warn:#F1B34C; --bad:#FF8A80;
    --good-bg:#15291F; --warn-bg:#2E2412; --bad-bg:#321A1A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1119; --surface:#161C28; --surface-2:#202838; --ink:#E8ECF4; --muted:#A0A9BB; --faint:#768096; --line:#2A3345;
  --good:#5CCB8F; --warn:#F1B34C; --bad:#FF8A80;
  --good-bg:#15291F; --warn-bg:#2E2412; --bad-bg:#321A1A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.compact{--pad:12px;--gap:10px;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:20px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.shell{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:var(--gap)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .when{font-weight:700;min-width:150px;text-align:center}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}

/* nav */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tab{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
@media (max-width:700px){
  .tabs{position:fixed;left:0;right:0;bottom:0;border-radius:0;border-width:1px 0 0;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chipbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=number]{width:96px}
textarea{width:100%;resize:vertical;min-height:80px}
.grow{flex:1 1 180px}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:700;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on-good{background:var(--good);color:#fff}
.seg button.on-warn{background:var(--warn);color:#fff}
.seg button.on-bad{background:var(--bad);color:#fff}
.seg.sm button{padding:4px 9px;font-size:12.5px}
.li .seg{flex:0 0 auto}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:ex}
.exlist li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface)}
.exlist li::before{counter-increment:ex;content:counter(ex);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);background:var(--surface-2);color:var(--muted)}
.exlist .exn{font-weight:700;overflow-wrap:anywhere}
.exlist .exm{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.eq{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--ink)}
.watch{white-space:nowrap}
.exedit{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.exedit input{flex:1 1 130px}
.grade{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.grade .big{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1}
.rv h3{margin-top:4px}
.rv ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.x{background:none;border:0;color:var(--faint);font-size:18px;line-height:1;padding:3px 7px;border-radius:7px}
.x:hover{color:var(--bad);background:var(--surface-2)}
.delbtn{color:var(--bad)}
.btn.danger{color:#fff;background:var(--bad);border-color:var(--bad)}
.addbtn{align-self:flex-start;border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
input.inline-title{border:1px solid transparent;background:transparent;font-weight:700;flex:1;min-width:0;padding:4px 6px;border-radius:8px}
input.inline-title:hover,input.inline-title:focus{border-color:var(--line);background:var(--surface)}
.inline-title::placeholder{color:var(--faint);font-weight:600}
.sublist{list-style:none;margin:0 0 0 34px;padding:0;display:flex;flex-direction:column;gap:4px}
.sublist li{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface-2);border-radius:8px;padding:5px 6px 5px 10px}
.sublist li span{flex:1;min-width:0;overflow-wrap:anywhere}

/* status chips */
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.plain{background:var(--surface-2);color:var(--muted)}

/* positivity */
.hero{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface) 70%)}
.affirm{font-size:21px;font-weight:700;line-height:1.35;margin:0;text-wrap:pretty}
body.compact .affirm{font-size:18px}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.qlist li{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--line)}
.flist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:10px}

/* words */
.word{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.word b{font-size:17px}
.word .ex{font-style:italic;color:var(--muted);font-size:14px}

/* must do */
.score{display:flex;align-items:center;gap:10px}
.ring{width:46px;height:46px}
.mi{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.mi.done{border-color:color-mix(in srgb, var(--good) 55%, var(--line))}
.mi-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mi-title{font-weight:700;font-size:16px;flex:1;min-width:120px}
.mi-sub{font-size:13px;color:var(--muted)}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)}
.live{font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.check{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;flex:0 0 auto;margin:0;background:var(--surface);cursor:pointer}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li.done .t{color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted);font-size:14px}

/* week grid */
.wgrid-wrap{overflow-x:auto}
.wgrid{border-collapse:collapse;width:100%;min-width:420px}
.wgrid th,.wgrid td{padding:6px 4px;text-align:center;font-size:13px}
.wgrid th:first-child,.wgrid td:first-child{text-align:left;font-weight:600;white-space:nowrap;padding-right:10px}
.wgrid thead th{color:var(--muted);font-weight:600}
.wgrid thead th.today{color:var(--accent)}
.cell{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;border:0;font-weight:800;font-size:13px}
.cell.done{background:var(--good);color:#fff}
.cell.part{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.cell.miss{background:var(--bad-bg);color:var(--bad)}
.cell.none{background:var(--surface-2);color:var(--faint)}
.wg{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.wg:last-child{border-bottom:0}
.wg .row{flex-wrap:nowrap}
.wg input[type=text]{width:100%}

/* goals */
.goal{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.goal-title{font-weight:700;font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.track{position:relative;height:12px;background:var(--surface-2);border-radius:99px}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.track .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.range{width:100%;accent-color:var(--accent)}
.forecast{font-size:14px;border-radius:10px;padding:8px 10px;background:var(--surface-2)}

/* insights */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.rate{display:grid;grid-template-columns:minmax(90px,150px) 1fr 54px;gap:10px;align-items:center;font-size:14px}
.rate .bar{height:12px}
.finding{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.finding:last-child{border-bottom:0}
.finding .pill{margin-top:2px}
.review{white-space:pre-wrap;font-size:14.5px;background:var(--surface-2);border-radius:10px;padding:12px}

/* customize */
.editlist{display:flex;flex-direction:column;gap:6px}
.editrow{display:flex;gap:6px;align-items:center}
.editrow input[type=text]{flex:1}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.help{font-size:13px;color:var(--muted);margin:0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:40}
.loading{padding:48px 0;text-align:center;color:var(--muted)}
.hidden-sec{opacity:.55}
@media (prefers-reduced-motion:no-preference){.bar i,.track .fill{transition:width .3s ease}}
</style>

<div class="shell">
  <header class="top">
    <div>
      <h1 id="appTitle">Daily Compass</h1>
      <div class="small muted" id="storeNote">Plan it, do it, see where it's heading</div>
    </div>
    <div class="datenav" id="datenav">
      <button class="iconbtn" data-act="prev" aria-label="Previous">‹</button>
      <span class="when" id="when"></span>
      <button class="iconbtn" data-act="next" aria-label="Next">›</button>
      <button class="btn sm" data-act="today">Today</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button class="tab" role="tab" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
    <button class="tab" role="tab" data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
    <button class="tab" role="tab" data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
    <button class="tab" role="tab" data-tab="custom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Customize</button>
  </nav>
  <main id="main"><div class="loading">Loading your day…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

let store = null;
const chains = {};
function queue(path, fn){
  chains[path] = (chains[path] || Promise.resolve()).then(fn).catch(e => {
    const c = e && e.code;
    toast(c === "invalid_argument" ? "You can view this app but not change it." : c === "quota_exceeded" ? "Storage is full. Delete some old goals to free space." : "Couldn't save just now. Try again in a moment.");
  });
}
function dbStore(db){
  const coll = (name, into) => db.collection(name).onSnapshot(s => {
    const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S[into] = m; S.loaded = true; render();
  }, e => toast("Live sync stopped. Reload the page to reconnect."));
  return {
    start(){
      db.doc("config/main").onSnapshot(s => { S.cfg = mergeCfg(s.exists ? s.data() : null); applyLook(); render(); restartFood(); }, () => {});
      coll("days","days"); coll("weeks","weeks"); coll("goals","goals"); coll("food","foodDocs");
    },
    put(col, id, body){ const b = clone(body); queue(col+"/"+id, () => db.doc(col+"/"+id).set(b)); },
    del(col, id){ queue(col+"/"+id, () => db.doc(col+"/"+id).delete()); }
  };
}

/* ================= live food status (Claude Code Remote → your food chat) ================= */
let foodUnsub = null, foodFor = null;
async function restartFood(force){
  if (!(window.claude && window.claude.use)) return;
  const sid = (S.cfg.foodSession || "").trim();
  if (sid === foodFor && !force) return;
  foodFor = sid;
  if (foodUnsub) { foodUnsub(); foodUnsub = null; }
  if (!sid) { S.food = {state:"nolink"}; render(); return; }
  let mcp = null;
  try { mcp = await window.claude.use("mcp"); } catch(e){}
  if (!mcp) { S.food = {state:"off"}; render(); return; }
  S.food = {state:"loading"}; render();
  foodUnsub = mcp.watchTool("Claude Code Remote", "get_session", {session_id: sid}, ev => {
    if (ev.type === "data") {
      const info = parseSession(ev.result && ev.result.payload);
      S.food = info ? Object.assign({state:"ok"}, info) : {state:"unreadable"};
    } else {
      const c = ev.error && ev.error.code;
      const denied = ["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","not_granted","selection_required"];
      if (denied.includes(c)) S.food = {state:"denied", code:c};
      else if (S.food.state !== "ok") S.food = {state:"error", code:c||"unknown"};
    }
    render();
  }, {refetchInterval: 60000});
}
async function allowFood(){
  let perm = null;
  try { perm = await window.claude.use("permissions"); } catch(e){}
  if (perm) { try { await perm.request(["mcp:Claude Code Remote"]); } catch(e){} }
  refreshFood();
}
async function refreshFood(){
  const sid = (S.cfg.foodSession || "").trim(); if (!sid) return;
  let mcp = null;
  try { mcp = await window.claude.use("mcp"); } catch(e){}
  if (!mcp) { S.food = {state:"off"}; render(); return; }
  S.food = {state:"loading"}; render();
  try {
    const r = await mcp.callTool("Claude Code Remote", "get_session", {session_id: sid}, {cache:false});
    const info = parseSession(r && r.payload);
    S.food = info ? Object.assign({state:"ok"}, info) : {state:"unreadable"};
    restartFood(true);
  } catch(e) {
    const c = e && e.code;
    S.food = ["needs_reauth","server_not_connected","server_not_found","blocked_by_policy","approval_required","not_in_manifest","not_granted","selection_required","consent_required"].includes(c) ? {state:"denied", code:c} : {state:"error", code:c||"unknown"};
  }
  render();
}
function parseSession(p){
  let o = p;
  if (typeof o === "string") { const a = o.indexOf("{"), b = o.lastIndexOf("}"); if (a < 0 || b < a) return null; try { o = JSON.parse(o.slice(a, b+1)); } catch(e){ return null; } }
  if (!o || typeof o !== "object") return null;
  const c = o.ccr || o.session || o;
  const em = c.external_metadata || {};
  const sm = c.post_turn_summary || em.post_turn_summary || {};
  return { detail: String(sm.status_detail || sm.recent_action || ""), next: String(sm.needs_action || ""), updated: c.updated_at || null };
}
function foodNums(text){
  const t = String(text || "");
  const k = t.match(/([\d,]{2,6})\s*kcal/i), p = t.match(/([\d.]{1,5})\s*g\s*protein/i) || t.match(/protein[^\d]{0,20}([\d.]{1,5})\s*g/i);
  return { kcal: k ? +k[1].replace(/,/g, "") : null, protein: p ? +p[1] : null };
}

const gymPlanFor = k => S.cfg.gym[parse(k).getDay()] || {focus:"", rest:false};
const ST = {done:1, partial:0.5, missed:0, skipped:0};
const stOf = x => x && x.status && x.status in ST ? ST[x.status] : (x && x.done ? 1 : null);
function segHtml(act, id, cur, extra, small){
  cur = cur === "skipped" ? "missed" : cur;
  return `<div class="seg ${small ? "sm" : ""}" role="group" aria-label="Status">
    <button type="button" data-act="${act}" data-id="${esc(id)}" data-v="done" ${extra||""} class="${cur==="done"?"on-good":""}">Done</button>
    <button type="button" data-act="${act}" data-id="${esc(id)}" data-v="partial" ${extra||""} class="${cur==="partial"?"on-warn":""}">Partly</button>
    <button type="button" data-act="${act}" data-id="${esc(id)}" data-v="missed" ${extra||""} class="${cur==="missed"?"on-bad":""}">Not done</button></div>`;
}
function itemScore(item, d, k){
  const v = d.must[item.id] || {};
  if (v.status && v.status in ST) return ST[v.status];
  switch (item.type) {
    case "gym": {
      return gymPlanFor(k).rest ? null : 0;
    }
    case "cardio": return clamp((+v.kcal || 0) / (S.cfg.cardioTarget || 400), 0, 1);
    case "reading": return v.podcast ? 1 : clamp((+v.pages || 0) / (S.cfg.readingMin || 4), 0, 1);
    case "food": return (v.done || S.foodDocs[k]) ? 1 : 0;

function rateDay(k, d){
  const well = [], bad = [], improve = [];
  S.cfg.must.forEach(it => {
    const s = itemScore(it, d, k), v = d.must[it.id] || {}, st = v.status === "skipped" ? "missed" : v.status;
    if (s == null) return;
    if (s >= 1) well.push(it.label);
    else if (st === "missed") bad.push(it.label + ": not done");
    else if (s > 0) improve.push(it.label + (it.type === "cardio" && !st ? `: ${Math.max(0, (S.cfg.cardioTarget||400) - (+v.kcal||0))} kcal short` : it.type === "reading" && !st ? `: ${Math.max(0, (S.cfg.readingMin||4) - (+v.pages||0))} pages short` : ": only partly done"));
    else bad.push(it.label + ": not logged");
  });
  const sh = [...S.cfg.shouldRepeat.map(r => ((d.repeatStatus||{})[r.id]) || ((d.repeatDone||{})[r.id] ? "done" : "")), ...d.should.map(x => x.status || (x.done ? "done" : ""))];
  const shScore = sh.length ? sh.reduce((a, st) => a + (ST[st] || 0), 0) / sh.length : null;
  if (shScore != null) (shScore >= .8 ? well : shScore >= .4 ? improve : bad).push(`Should-do list: ${Math.round(shScore*100)}% done`);
  const used = Object.values(d.wordsUsed || {}).filter(Boolean).length;

  const must = dayScore(k, d);
  const extras = (d.note && d.note.trim() ? .5 : 0) + (used ? .5 : 0);

  const wsum = parts.reduce((a, p) => a + p[1], 0);
  const score = wsum ? Math.round(parts.reduce((a, p) => a + p[0]*p[1], 0) / wsum * 100) / 10 : null;
  const grade = score == null ? null : score >= 9 ? ["A+","Outstanding day","good"] : score >= 8 ? ["A","Great day","good"] : score >= 6.5 ? ["B","Good day","good"] : score >= 5 ? ["C","Average day","warn"] : ["D","Tough day","bad"];
  return {score, grade, well, bad, improve};
}

function analyse(N){

  const first = keys[0];
  const range = [];
  if (first) for (let i = N-1; i >= 0; i--) { const k = addDays(t, -i); if (k >= first) range.push(k); }
  const scores = range.map(k => ({k, s: dayScore(k)}));
  const valid = scores.filter(x => x.s != null);
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const counts = it => { const c = {done:0, partial:0, missed:0, none:0}; range.forEach(k => { const v = peekDay(k).must[it.id] || {}, s = itemScore(it, peekDay(k), k); if (s == null) return;
    const st = v.status === "skipped" ? "missed" : v.status; if (st in c) c[st]++; else if (s >= 1) c.done++; else if (s > 0) c.partial++; else c.none++; }); return c; };
  const items = S.cfg.must.map(it => {
    const vals = range.map(k => itemScore(it, peekDay(k), k)).filter(x => x != null);
    return {it, rate: avg(vals), n: vals.length, full: vals.filter(x => x >= 1).length, c: counts(it)};
  });
  const cardioIt = S.cfg.must.find(i => i.type === "cardio"), readIt = S.cfg.must.find(i => i.type === "reading"), gymIt = S.cfg.must.find(i => i.type === "gym"), foodIt = S.cfg.must.find(i => i.type === "food");

  const pages = readIt ? range.map(k => +((peekDay(k).must[readIt.id]||{}).pages) || 0) : [];

  const gymFocus = gymIt ? S.cfg.gym.map((g, wd) => {

  return {range, scores, valid, avgScore: avg(valid.map(x=>x.s)), items, kcals, pages, weekday, gymFocus, last7, prev7, streak, wkRate, cardioIt, readIt, gymIt, foodIt,
    avgKcal: avg(kcals), avgPages: avg(pages)};
}
function findings(A){
  const out = [], T = S.cfg.cardioTarget || 400;

  if (A.last7 != null && A.prev7 != null) {
    const d = A.last7 - A.prev7;
    if (d >= 0.1) out.push({c:"good", t:`You're improving: the last 7 days averaged ${pct(A.last7)}, up from ${pct(A.prev7)} the week before.`});
    else if (d <= -0.1) out.push({c:"bad", t:`You're slipping: the last 7 days averaged ${pct(A.last7)}, down from ${pct(A.prev7)} the week before.`});
    else out.push({c:"plain", t:`Steady: the last 7 days averaged ${pct(A.last7)}, about the same as the week before.`});
  }

  if (ranked.length) {

    if (hi.v - lo.v >= 0.2) out.push({c:"warn", t:`${WEEKDAYS[lo.i]} is your weakest day (${pct(lo.v)} on average) and ${WEEKDAYS[hi.i]} your best (${pct(hi.v)}). Plan ${WEEKDAYS[lo.i]}s in advance.`});
  }

  if (A.wkRate != null) out.push({c: A.wkRate >= .8 ? "good" : A.wkRate >= .5 ? "warn" : "bad", t:`Weekly goals: ${pct(A.wkRate)} completed across the weeks you tracked.`});

}

/* ================= actions ================= */
function setTab(t){ S.tab = t; S.confirm = null; try { localStorage.setItem("dc-tab", t); } catch(e){} render(); window.scrollTo(0, 0); }
function mutMust(id, fn){ const k = S.date, d = getDay(k); d.must[id] = d.must[id] || {}; fn(d.must[id], d); putDay(k, d); }
function moveIn(arr, i, n){ const j = i + n; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if (tb) { setTab(tb.dataset.tab); return; }
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT" && el.type !== "button") return;
  const a = el.dataset.act, id = el.dataset.id, c = S.cfg;
  if (a !== "ask-del" && !el.dataset.confirm && S.confirm) S.confirm = null;
  const step = S.tab === "week" ? 7 : 1;
  switch (a) {
    case "prev": S.date = addDays(S.date, -step); render(); break;
    case "next": S.date = addDays(S.date, step); render(); break;
    case "today": S.date = todayKey(); render(); break;
    case "open-day": S.date = el.dataset.k; setTab("today"); break;
    case "toggle": mutMust(id, v => v.done = !v.done); break;
    case "gym": case "status": mutMust(id, v => { const cur = v.status === "skipped" ? "missed" : v.status; v.status = cur === el.dataset.v ? "" : el.dataset.v; }); break;
    case "should-status": { const d = getDay(S.date), x = d.should.find(s => s.id === id); if (x) { const cur = x.status || (x.done ? "done" : ""); x.status = cur === el.dataset.v ? "" : el.dataset.v; x.done = x.status === "done"; } putDay(S.date, d); break; }
    case "rep-status": { const d = getDay(S.date); d.repeatStatus = d.repeatStatus || {}; const cur = d.repeatStatus[id] || ((d.repeatDone||{})[id] ? "done" : ""); d.repeatStatus[id] = cur === el.dataset.v ? "" : el.dataset.v; if (d.repeatDone) delete d.repeatDone[id]; putDay(S.date, d); break; }
    case "wk-status": { const m = mondayOf(S.date), w = S.weeks[m] ? clone(S.weeks[m]) : {items:{}}; w.items = w.items || {}; const v = w.items[id] = w.items[id] || {}; const cur = v.status || (v.done ? "done" : ""); v.status = cur === el.dataset.v ? "" : el.dataset.v; v.done = v.status === "done"; putWeek(m, w); break; }
    case "rate-day": reviewDay(); break;
    case "ex-add": { const i = +el.dataset.i, g = c.gym[i]; g.ex = g.ex || []; g.ex.push({id:uid(), n:"", eq:"", r:"", m:"", url:""}); S.openCat = "gx" + i; S.focus = "ex-" + i + "-" + (g.ex.length - 1); saveCfg(); break; }
    case "ex-del": { const i = +el.dataset.i; c.gym[i].ex.splice(+el.dataset.j, 1); S.openCat = "gx" + i; saveCfg(); break; }
    case "kcal-add": mutMust(id, v => v.kcal = (+v.kcal || 0) + +el.dataset.n); break;
    case "way": mutMust(id, v => { v.ways = v.ways || []; const w = el.dataset.w; v.ways = v.ways.includes(w) ? v.ways.filter(x => x !== w) : [...v.ways, w]; }); break;
    case "pages": mutMust(id, v => v.pages = Math.max(0, (+v.pages || 0) + +el.dataset.n)); break;
    case "podcast": mutMust(id, v => v.podcast = !v.podcast); break;
    case "should-del": { const d = getDay(S.date); d.should = d.should.filter(x => x.id !== id); putDay(S.date, d); break; }
    case "shuffle": { const d = getDay(S.date); d.quoteShift = (d.quoteShift || 0) + 1; delete d.fresh; putDay(S.date, d); break; }
    case "fresh": freshQuotes(el); break;
    case "range": S.range = +el.dataset.n; render(); break;
    case "review": coachReview(); break;
    case "ask-del": { const key = el.dataset.key; S.confirm = key; render(); setTimeout(() => { if (S.confirm === key) { S.confirm = null; render(); } }, 5000); break; }
    case "g-del": S.confirm = null; delGoal(id); break;
    case "g-add": { const h = c.horizons.find(x => x.id === el.dataset.h) || {months:3}, t = todayKey(), gid = uid();
      S.focus = "gti-" + gid; putGoal({id:gid, horizon:el.dataset.h, title:"", why:"", start:t, target:addMonths(t, h.months || 3), progress:0, milestones:[], log:[{d:t, p:0}], created:Date.now()}); break; }
    case "hz-add": { const hid = uid(); c.horizons.push({id:hid, label:"", months:24}); S.focus = "hzl-" + hid; saveCfg(); break; }
    case "hz-del": S.confirm = null; c.horizons = c.horizons.filter(h => h.id !== id); Object.values(S.goals).filter(g => g.horizon === id).forEach(g => delGoal(g.id)); saveCfg(); break;
    case "must-add": { const mid = uid(); c.must.push({id:mid, type:"check", label:""}); S.focus = "ml-" + mid; saveCfg(); break; }
    case "must-del": S.confirm = null; c.must = c.must.filter(m => m.id !== id); saveCfg(); break;
    case "wk-add": { const wid = uid(); c.weekly.push({id:wid, label:"", hint:"Add a note"}); S.focus = "wkl-" + wid; saveCfg(); break; }
    case "wk-del": S.confirm = null; c.weekly = c.weekly.filter(g => g.id !== id); saveCfg(); break;
    case "wk-entry-del": { const m = mondayOf(S.date), w = S.weeks[m] ? clone(S.weeks[m]) : {items:{}}; w.items = w.items || {}; const v = w.items[id] = w.items[id] || {};
      v.entries = entriesOf(v).filter(x => x.id !== el.dataset.e); delete v.note; putWeek(m, w); break; }
    case "cfg-add": { const key = el.dataset.key, item = {id:uid(), label:""}; if (key === "must") item.type = "check"; if (key === "horizons") item.months = 3; if (key === "weekly") item.hint = "Add a note";
      c[key].push(item); S.focus = "cfgl-" + key + "-" + (c[key].length - 1); saveCfg(); break; }
    case "q-add": { const base = clone(quotes()); (base[el.dataset.c] = base[el.dataset.c] || []).push(""); c.quotes = base; S.openCat = el.dataset.c; S.focus = "q-" + el.dataset.c + "-" + (base[el.dataset.c].length - 1); saveCfg(); break; }
    case "q-del": { const base = clone(quotes()); base[el.dataset.c].splice(+el.dataset.i, 1); c.quotes = base; S.openCat = el.dataset.c; saveCfg(); break; }
    case "w-add": { const base = clone(words()); base.push(["","",""]); c.words = base; S.openCat = "words"; S.focus = "w-" + (base.length - 1); saveCfg(); break; }
    case "w-del": { const base = clone(words()); base.splice(+el.dataset.i, 1); c.words = base; S.openCat = "words"; saveCfg(); break; }
    case "food-allow": allowFood(); break;
    case "food-refresh": refreshFood(); break;
    case "ms-del": { const g = clone(S.goals[id]); g.milestones = g.milestones.filter(x => x.id !== el.dataset.ms); logProgress(g); putGoal(g); break; }
    case "accent": c.accent = el.dataset.v; saveCfg(); break;
    case "cfg-set": c[el.dataset.f] = el.dataset.v; saveCfg(); break;
    case "sec-toggle": { const s = el.dataset.s; c.hidden = c.hidden.includes(s) ? c.hidden.filter(x => x !== s) : [...c.hidden, s]; saveCfg(); break; }
    case "sec-move": moveIn(c.todayOrder, +el.dataset.i, +el.dataset.n); saveCfg(); break;
    case "cfg-move": moveIn(c[el.dataset.key], +el.dataset.i, +el.dataset.n); saveCfg(); break;
    case "cfg-del": S.confirm = null; c[el.dataset.key].splice(+el.dataset.i, 1); saveCfg(); break;
    case "restore-must": { const t = el.dataset.t, def = DEFAULT_CONFIG.must.find(m => m.type === t); if (def) { c.must.push(clone(def)); saveCfg(); } break; }
    case "reset-quotes": c.quotes = null; saveCfg(); break;
    case "reset-words": c.words = null; saveCfg(); break;
  }
});

document.addEventListener("change", e => {
  const el = e.target, a = el.dataset.act, id = el.dataset.id, c = S.cfg; if (!a) return;
  const k = S.date;
  switch (a) {
    case "toggle-box": mutMust(id, v => v.done = el.checked); break;
    case "field": mutMust(id, v => { const f = el.dataset.f; v[f] = el.type === "number" ? (el.value === "" ? "" : Math.max(0, +el.value)) : el.value.trim(); }); break;
    case "word-used": { const d = getDay(k); d.wordsUsed[el.dataset.w] = el.checked; putDay(k, d); break; }
    case "should-toggle": { const d = getDay(k); const x = d.should.find(s => s.id === id); if (x) x.done = el.checked; putDay(k, d); break; }
    case "rep-toggle": { const d = getDay(k); d.repeatDone = d.repeatDone || {}; d.repeatDone[id] = el.checked; putDay(k, d); break; }
    case "note": { const d = getDay(k); if (d.note !== el.value) { d.note = el.value; putDay(k, d); toast("Note saved"); } break; }
    case "wk-toggle": case "wk-note": {
      const m = mondayOf(k), w = S.weeks[m] ? clone(S.weeks[m]) : {items:{}}; w.items = w.items || {}; w.items[id] = w.items[id] || {};
      if (a === "wk-toggle") w.items[id].done = el.checked; else w.items[id].note = el.value.trim();
      putWeek(m, w); break;
    }
    case "g-title": case "g-why": case "g-target": case "g-progress": case "ms-toggle": {
      const g = clone(S.goals[id]); if (!g) break;
      if (a === "g-title") g.title = el.value.trim();
      if (a === "g-why") g.why = el.value.trim();
      if (a === "g-target" && el.value) g.target = el.value;
      if (a === "g-progress") { g.progress = +el.value; logProgress(g); }
      if (a === "ms-toggle") { const x = g.milestones.find(m => m.id === el.dataset.ms); if (x) x.done = el.checked; logProgress(g); }
      putGoal(g); break;
    }
    case "cfg": c[el.dataset.f] = el.value.trim(); saveCfg(); if (el.dataset.f === "foodSession") restartFood(); break;
    case "cfg-num": { const n = +el.value; if (n > 0) { c[el.dataset.f] = n; saveCfg(); } break; }
    case "cfg-label": { const v = el.value.trim(); if (v) { c[el.dataset.key][+el.dataset.i].label = v; saveCfg(); } else render(); break; }
    case "gym-focus": c.gym[+el.dataset.i].focus = el.value.trim(); saveCfg(); break;
    case "gym-rest": c.gym[+el.dataset.i].rest = el.checked; saveCfg(); break;
    case "ex-edit": { const x = (c.gym[+el.dataset.i].ex || [])[+el.dataset.j]; if (x) { x[el.dataset.f] = el.value.trim(); S.openCat = "gx" + el.dataset.i; saveCfg(); } break; }
    case "hz-months": c.horizons[+el.dataset.i].months = clamp(+el.value || 3, 1, 60); saveCfg(); break;
    case "must-label": { const m = c.must.find(x => x.id === id); if (m && el.value.trim() !== m.label) { m.label = el.value.trim(); saveCfg(); } break; }
    case "wk-label": { const g = c.weekly.find(x => x.id === id); if (g && el.value.trim() !== g.label) { g.label = el.value.trim(); saveCfg(); } break; }
    case "hz-label": { const h = c.horizons[+el.dataset.i]; if (h) { h.label = el.value.trim(); saveCfg(); } break; }
    case "q-edit": { const base = clone(quotes()); base[el.dataset.c][+el.dataset.i] = el.value.trim(); c.quotes = base; S.openCat = el.dataset.c; saveCfg(); break; }
    case "w-edit": { const base = clone(words()); base[+el.dataset.i][+el.dataset.p] = el.value.trim(); c.words = base; S.openCat = "words"; saveCfg(); break; }
    case "quotes": { const base = clone(quotes()); base[el.dataset.c] = el.value.split("\n").map(s => s.trim()).filter(Boolean); c.quotes = base; saveCfg(); toast("Quotes saved"); break; }
    case "words": { c.words = el.value.split("\n").map(l => l.split("|").map(s => s.trim())).filter(p => p[0]).map(p => [p[0], p[1] || "", p[2] || ""]); saveCfg(); toast("Words saved"); break; }
  }
});
document.addEventListener("toggle", e => { const t = e.target; if (t.dataset && t.dataset.cat) S.openCat = t.open ? t.dataset.cat : (S.openCat === t.dataset.cat ? null : S.openCat); }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("input[type=text][data-act], input[type=number][data-act], input[type=url][data-act]")) e.target.blur();
});

function logProgress(g){
  const t = todayKey(), p = goalPct(g);
  g.log = (g.log || []).filter(x => x.d !== t); g.log.push({d:t, p}); g.log = g.log.slice(-200);
}

document.addEventListener("submit", e => {
  e.preventDefault();
  const ae = document.activeElement, fid = ae && ae.id;
  if (ae && ae.blur) ae.blur();
  pendingRender = false; S.focus = fid || null;
  const f = e.target, kind = f.dataset.form, k = S.date;
  if (kind === "should") {
    const inp = $("shouldText"), text = inp.value.trim(); if (!text) return;
    const d = getDay(k); d.should.push({id:uid(), text, done:false}); inp.value = ""; putDay(k, d); setTimeout(() => { const i = $("shouldText"); if (i) i.focus(); }, 0);
  } else if (kind === "goal") {
    const h = f.dataset.h, title = $("gt-"+h).value.trim(), target = $("gd-"+h).value; if (!title || !target) return;
    const g = {id:uid(), horizon:h, title, why:"", start:todayKey(), target, progress:0, milestones:[], log:[{d:todayKey(), p:0}]};
    $("gt-"+h).value = ""; putGoal(g);
  } else if (kind === "ms") {
    const id = f.dataset.id, inp = $("ms-"+id), text = inp.value.trim(); if (!text) return;
    const g = clone(S.goals[id]); g.milestones = g.milestones || []; g.milestones.push({id:uid(), text, done:false}); logProgress(g);
    inp.value = ""; putGoal(g); setTimeout(() => { const i = $("ms-"+id); if (i) i.focus(); }, 0);
  } else if (kind === "food-paste") {
    const text = $("foodPaste").value.trim(); if (!text) return;
    const n = foodNums(text), doc = {detail:text.slice(0, 600), next:"", kcal:n.kcal, protein:n.protein, updatedAt:new Date().toISOString(), source:"paste"};
    S.foodDocs[k] = doc; store.put("food", k, doc);
    const foodIt = S.cfg.must.find(m => m.type === "food");
    if (foodIt) { const d = getDay(k); const v = d.must[foodIt.id] = d.must[foodIt.id] || {}; if (n.kcal != null) v.kcalIn = n.kcal; if (n.protein != null) v.protein = n.protein; v.done = true; putDay(k, d); } else render();
    toast("Food report saved");
  } else if (kind === "wk-entry") {
    const id = f.dataset.id, inp = $("wke-"+id), text = inp.value.trim(); if (!text) return;
    const m = mondayOf(k), w = S.weeks[m] ? clone(S.weeks[m]) : {items:{}}; w.items = w.items || {}; const v = w.items[id] = w.items[id] || {};
    v.entries = entriesOf(v).concat({id:uid(), text}); delete v.note; inp.value = ""; S.focus = "wke-" + id; putWeek(m, w);
  } else if (kind === "cfg-add") {
    const key = f.dataset.key, inp = $("add-"+key), label = inp.value.trim(); if (!label) return;
    const item = {id:uid(), label};
    if (key === "must") item.type = "check";
    if (key === "horizons") item.months = 3;
    S.cfg[key].push(item); inp.value = ""; saveCfg();
  }
});

async function freshQuotes(btn){
  if (!S.sample) return;
  btn.disabled = true; btn.textContent = "Writing…";
  const k = S.date;
  try {
    const out = await S.sample.json(`Write 7 short, original, uplifting quotes (max 28 words each) for someone's morning. They work in business, go to the gym, track clean food, read daily, and want to stay consistent with personal goals.
Reply with only a JSON object with these string keys:
affirm (a first-person "I am/I will" affirmation), grateful (positivity and gratitude), consistency (staying consistent with goals), work (productivity and personal branding at work), fitness (health and fitness), food (clean eating), reading (reading and learning).
Today is ${fmt(k,{weekday:"long", day:"numeric", month:"long"})}.`, {modelTier:"quick", cache:false});
    const fresh = {}; QUOTE_CATS.forEach(c => { if (out && typeof out[c.id] === "string") fresh[c.id] = out[c.id].slice(0, 300); });
    if (!Object.keys(fresh).length) throw {code:"invalid_json"};
    const d = getDay(k); d.fresh = fresh; putDay(k, d);
  } catch(e) {
    const c = e && e.code;
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)) { S.sample = null; toast("Claude isn't available for this app, so the built-in quotes will be used."); }
    else if (c === "rate_limited") toast("Claude is busy for your account right now. Try again later.");
    else if (c !== "cancelled") toast("Couldn't get new quotes. Try again.");
    render();
  }
}
async function coachReview(){
  if (!S.sample || S.reviewBusy) return;
  const A = analyse(S.range);
  const data = {
    days_tracked: A.valid.length, range_days: S.range, avg_must_do_score: A.avgScore,
    last7_avg: A.last7, previous7_avg: A.prev7, all_must_do_streak: A.streak,
    per_item: A.items.map(x => ({item:x.it.label, completion:x.rate, days:x.n, done:x.c.done, partly:x.c.partial, not_done:x.c.missed, not_logged:x.c.none})),
    by_weekday: Object.fromEntries(A.weekday.map((v, i) => [WEEKDAYS[i], v])),
    gym_by_focus: A.gymFocus.map(g => ({day:WEEKDAYS[g.wd], focus:g.focus, done:g.done, planned:g.planned})),
    cardio_avg_kcal: A.avgKcal, cardio_target: S.cfg.cardioTarget, pages_total: A.pages.reduce((a,b)=>a+b,0), reading_goal_pages_per_day: S.cfg.readingMin,
    weekly_goal_rate: A.wkRate,
    long_term_goals: Object.values(S.goals).map(g => ({title:g.title, horizon:g.horizon, progress_pct:goalPct(g), target:g.target, forecast:goalForecast(g).txt}))
  };
  S.reviewBusy = true; S.review = null; render();
  try {
    const r = await S.sample(`You are a supportive but direct personal performance coach. Review my habit data below (scores are 0 to 1).
Give: 1) a two-sentence overall diagnosis, 2) three patterns or trends you see, with numbers, 3) what will happen in the next 30 days if I continue exactly like this, 4) three specific actions for next week. Use short plain sentences, no markdown headings, numbered lists are fine. Under 220 words.

${JSON.stringify(data)}`, {cache:false});
    S.review = r.text;
  } catch(e) {
    const c = e && e.code;
    S.review = e && e.text ? e.text : null;
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)) { S.sample = null; toast("Claude isn't available for this app."); }
    else if (c === "rate_limited") toast("Claude is busy for your account right now. Try again later.");
    else if (c !== "cancelled") toast("The review didn't finish. Try again.");
  }
  S.reviewBusy = false; render();
}

let toastT = null;
function toast(m){ const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500); }

let lastToday = todayKey();
setInterval(() => { const t = todayKey(); if (t !== lastToday) { if (S.date === lastToday) S.date = t; lastToday = t; render(); } }, 60000);

boot();
})();
</script>
